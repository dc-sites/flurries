<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Your Pass - Flurries '26</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="snow-container"></div>

    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-snowflake"></i>
            <span>FLURRIES '26</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="buypass.html"><i class="fas fa-ticket-alt"></i> Buy Pass</a></li>
            <li><a href="getpass.html" class="active"><i class="fas fa-download"></i> Get Pass</a></li>
      
        </ul>
    </nav>

    <section class="getpass-section">
        <div class="getpass-container">
            <h1><i class="fas fa-download"></i> Download Your Pass</h1>
            
            <div class="search-box">
                <input type="text" id="passIdInput" placeholder="Enter your 8-character Pass ID" maxlength="8">
                <button onclick="getPass()" class="search-btn">
                    <i class="fas fa-search"></i> Get Pass
                </button>
            </div>

            <div id="passDisplay" class="pass-display" style="display: none;">
                <div class="ticket-pass" id="ticketPass">
                    <div class="pass-left">
                        <div class="pass-header">
                            <h2>FLURRIES '26</h2>
                            <span class="pass-type">VIP PASS</span>
                        </div>
                        <div class="pass-details">
                            <div class="detail-row">
                                <i class="fas fa-user"></i>
                                <div>
                                    <label>Name</label>
                                    <span id="passName"></span>
                                </div>
                            </div>
                            <div class="detail-row">
                                <i class="fas fa-phone"></i>
                                <div>
                                    <label>Phone</label>
                                    <span id="passPhone"></span>
                                </div>
                            </div>
                            <div class="detail-row">
                                <i class="fas fa-layer-group"></i>
                                <div>
                                    <label>Batch</label>
                                    <span id="passBatch"></span>
                                </div>
                            </div>
                            <div class="detail-row">
                                <i class="fas fa-ticket-alt"></i>
                                <div>
                                    <label>Pass ID</label>
                                    <span id="passIdDisplay"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="pass-right">
                        <div id="qrcode"></div>
                        <p class="scan-text">Scan at entry</p>
                    </div>
                </div>
                
                <button onclick="downloadPass()" class="download-btn">
                    <i class="fas fa-download"></i> Download Pass
                </button>
            </div>

            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </div>
    </section>

    <footer>
        <p>Designed by <a href="https://hexasolutions.online" target="_blank">Hexa Solutions</a></p>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/getpass.js"></script>
    <script src="js/snow.js"></script>
</body>
</html>
